apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-evolution.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning",
          "Tgs.GameRecord.Evolution.Messages": "Information",
          "Tgs.GameRecord.Evolution.Core.ApplicationServices.HandleRecordCommandService": "Information"
        }
      },
      "GameRecord": {
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameInterfaceClientBaseUrl": "dns:///game-gameinterface-evolution-service:9090/"
      },
      "GameRecordInfo": {
        "GameProviderCode": "EVOTF",
        "GameProviderConfiguration": "EVOTFConfiguration",
        "HangfirePrefix": "gamerecord-evotf-hangfire:",
        "HangfireLocking": "gamerecord-evotf-locking:",
        "IntervalMinutes": 10,
        "IntervalMinutesMax": 1440,
        "IntervalMinutesMinimum": 1
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
